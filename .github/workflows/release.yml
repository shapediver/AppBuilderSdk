name: release

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Deploy latest or create a version release.
        required: true
        type: choice
        options:
          - latest
          - version
      version_bump:
        description: Version increment for version releases. If the current package version is a prerelease, its stable base version is released.
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes_file:
        description: Required for minor/major version releases, e.g. .github/release-notes/app-builder-1.10.md.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: appbuilder-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate inputs
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          RELEASE_NOTES_FILE: ${{ inputs.release_notes_file }}
        run: |
          case "$RELEASE_TARGET" in latest|version) ;; *) echo "Invalid release_target: $RELEASE_TARGET" >&2; exit 1;; esac
          if [[ "$RELEASE_TARGET" == "version" ]]; then
            case "$VERSION_BUMP" in patch|minor|major) ;; *) echo "version_bump is required for version releases." >&2; exit 1;; esac
            if [[ "$VERSION_BUMP" != "patch" && -z "$RELEASE_NOTES_FILE" ]]; then
              echo "release_notes_file is required for minor and major AppBuilder releases." >&2
              exit 1
            fi
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout master
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.3.0

      - name: Setup Node.js for npmjs
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Configure npmjs registry
        run: |
          pnpm config delete @shapediver:registry || true
          pnpm config set registry https://registry.npmjs.org

      - name: Verify production lockfile does not use GitHub Packages
        run: |
          if grep -q "npm.pkg.github.com" pnpm-lock.yaml 2>/dev/null; then
            echo "Production release must install from npmjs.org only; lockfile references npm.pkg.github.com." >&2
            exit 1
          fi
          if [ -f .npmrc ] && grep -v '^#' .npmrc | grep -q 'npm.pkg.github.com'; then
            echo "Production release must install from npmjs.org only; .npmrc has an active npm.pkg.github.com reference." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git user
        shell: bash
        run: |
          APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Write Sentry config
        env:
          SENTRY_CONFIG_LOCAL_TS: ${{ secrets.SENTRY_CONFIG_LOCAL_TS }}
        run: printf '%s' "$SENTRY_CONFIG_LOCAL_TS" > sentryconfig.local.ts

      - name: Export deployment env
        run: |
          echo "APPBUILDER_BUCKET=${{ secrets.APPBUILDER_BUCKET }}" >> "$GITHUB_ENV"
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Parse release notes
        id: release-notes
        if: inputs.release_target == 'version' && inputs.version_bump != 'patch'
        env:
          RELEASE_NOTES_FILE: ${{ inputs.release_notes_file }}
        run: node scripts/release/read-appbuilder-release-notes.mjs "$RELEASE_NOTES_FILE"

      - name: Notify Slack release started
        continue-on-error: true
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW: ${{ github.workflow }}
          TARGET: ${{ inputs.release_target }}
          BUMP: ${{ inputs.version_bump }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping Slack notification."
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          LABEL="$TARGET${BUMP:+/$BUMP}"
          PAYLOAD="$(jq -cn --arg workflow "$WORKFLOW" --arg label "$LABEL" --arg commitUrl "$COMMIT_URL" --arg shortSha "$SHORT_SHA" --arg runUrl "$RUN_URL" '{attachments:[{color:"#1d9bf0",blocks:[{type:"section",text:{type:"mrkdwn",text:":rocket: *AppBuilder production release started*"}},{type:"section",fields:[{type:"mrkdwn",text:"*Status:*\nIn progress"},{type:"mrkdwn",text:("*Workflow:*\n" + $workflow)},{type:"mrkdwn",text:("*Release:*\n`" + $label + "`")},{type:"mrkdwn",text:("*Commit:*\n<" + $commitUrl + "|`" + $shortSha + "`>")} ]},{type:"actions",elements:[{type:"button",text:{type:"plain_text",text:"View Run"},url:$runUrl,style:"primary"}]}]}]}')"
          curl -sS --max-time 15 -X POST -H "Content-type: application/json" --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" >/dev/null || echo "Slack notification failed."

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test

      - name: Run Playwright E2E with explicit testing deploy
        run: pnpm test-e2e
        env:
          APPBUILDER_E2E_DEPLOY: "1"
          APPBUILDER_E2E_SKIP_INSTALL: "1"
          APPBUILDER_ASSUME_YES: "1"
          APPBUILDER_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          PLATFORM_ACCESS_TOKEN_KEY: ${{ secrets.PLATFORM_ACCESS_TOKEN_KEY }}
          PLATFORM_ACCESS_TOKEN_SECRET: ${{ secrets.PLATFORM_ACCESS_TOKEN_SECRET }}

      - name: Deploy production
        run: pnpm run publish
        env:
          APPBUILDER_RELEASE_TARGET: ${{ inputs.release_target }}
          APPBUILDER_VERSION_BUMP: ${{ inputs.version_bump }}
          APPBUILDER_ASSUME_YES: "1"
          APPBUILDER_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Read released version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: inputs.release_target == 'version' && inputs.version_bump != 'patch'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: AppBuilderMain@${{ steps.version.outputs.version }}
          name: ${{ steps.release-notes.outputs.title }}
          generate_release_notes: true
          body_path: ${{ steps.release-notes.outputs.body_path }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Collect release failure artifacts
        if: failure()
        shell: bash
        run: |
          rm -rf .github-artifacts/failure
          mkdir -p .github-artifacts/failure
          for path in playwright-report test-results dist; do
            if [[ -e "$path" ]]; then cp -R "$path" .github-artifacts/failure/; fi
          done

      - name: Upload release failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-failure-artifacts
          if-no-files-found: ignore
          compression-level: 0
          path: .github-artifacts/failure/

  notify:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production

    steps:
      - name: Notify Slack
        continue-on-error: true
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_RESULT: ${{ needs.release.result }}
          VERSION: ${{ needs.release.outputs.version }}
          WORKFLOW: ${{ github.workflow }}
          TARGET: ${{ inputs.release_target }}
          BUMP: ${{ inputs.version_bump }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping Slack notification."
            exit 0
          fi
          case "$RELEASE_RESULT" in success) COLOR="#36a64f"; EMOJI=":white_check_mark:"; STATUS_LABEL="Succeeded";; cancelled) COLOR="#808080"; EMOJI=":warning:"; STATUS_LABEL="Cancelled";; *) COLOR="#cc0000"; EMOJI=":x:"; STATUS_LABEL="Failed";; esac
          SHORT_SHA="${SHA:0:7}"
          LABEL="$TARGET${BUMP:+/$BUMP}${VERSION:+ ($VERSION)}"
          PAYLOAD="$(jq -cn --arg color "$COLOR" --arg emoji "$EMOJI" --arg statusLabel "$STATUS_LABEL" --arg workflow "$WORKFLOW" --arg label "$LABEL" --arg commitUrl "$COMMIT_URL" --arg shortSha "$SHORT_SHA" --arg runUrl "$RUN_URL" '{attachments:[{color:$color,blocks:[{type:"section",text:{type:"mrkdwn",text:($emoji + " *AppBuilder production release finished*")}},{type:"section",fields:[{type:"mrkdwn",text:("*Status:*\n" + $statusLabel)},{type:"mrkdwn",text:("*Workflow:*\n" + $workflow)},{type:"mrkdwn",text:("*Release:*\n`" + $label + "`")},{type:"mrkdwn",text:("*Commit:*\n<" + $commitUrl + "|`" + $shortSha + "`>")} ]},{type:"actions",elements:[{type:"button",text:{type:"plain_text",text:"View Run"},url:$runUrl}]}]}]}')"
          curl -sS --max-time 15 -X POST -H "Content-type: application/json" --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" >/dev/null || echo "Slack notification failed."
